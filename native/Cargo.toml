[package]
name = "devkit"
version = "0.3.0"
description = "DevKit - 轻量原生开发工具箱"
edition = "2021"

[dependencies]
gpui-kit = { version = "0.10", features = ["tree-sitter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
base64 = "0.22"
urlencoding = "2"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 2
strip = true
